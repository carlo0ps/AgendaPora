<!doctype html><html lang="es-PY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content=""><script>
    (() => {
      const cleanLegacyWorker = async () => {
        if (navigator.serviceWorker) {
          const registrations = await navigator.serviceWorker.getRegistrations().catch(() => []);
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)));
        }
        if (document.readyState !== 'complete') {
          await new Promise(resolve => window.addEventListener('load', resolve, { once: true }));
        }
        await new Promise(resolve => setTimeout(resolve, 100));
        if ('caches' in window) {
          const keys = await caches.keys().catch(() => []);
          await Promise.all(keys.map(key => caches.delete(key).catch(() => false)));
        }
        const currentUrl = new URL(location.href);
        if (currentUrl.searchParams.get('__agendapora_worker_retired') === '1') {
          currentUrl.searchParams.delete('__agendapora_worker_retired');
          history.replaceState(history.state, '', `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
        }
      };
      cleanLegacyWorker().catch(() => {});
    })();
  </script><meta name="description" content="Reservá tu próximo turno."><title>Reservar turno · AgendaPorã</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><script type="module" src="js/reservar.js"></script></head><body class="booking-page"><div id="toast-region" class="toast-region" aria-live="polite"></div><main class="booking-shell"><a class="brand booking-brand" href="index.html"><img id="salon-logo" src="icons/icon.svg" alt=""><span><strong id="salon-name">Reservas</strong><small>Reservá tu próximo turno</small></span></a><section id="booking-card" class="booking-card"><p class="eyebrow">Agenda en línea</p><h1>Elegí tu turno</h1><p id="booking-intro" class="muted">Cargando horarios disponibles…</p><form id="booking-form" class="form-grid hidden"><label class="field wide">Servicio<select id="booking-service" required></select></label><label class="field">Día<input id="booking-date" type="date" required></label><label class="field">Horario<select id="booking-time" required><option value="">Elegí un horario</option></select></label><label class="field">Tu nombre<input id="booking-client-name" maxlength="80" required autocomplete="name"></label><label class="field">Teléfono / WhatsApp<input id="booking-phone" type="tel" maxlength="24" required autocomplete="tel" placeholder="0981 123 456"></label><label class="honeypot" aria-hidden="true">Dejar vacío<input id="booking-website" tabindex="-1" autocomplete="off"></label><button class="button primary wide" type="submit">Solicitar reserva</button><p id="booking-error" class="form-error wide" role="alert"></p></form><div id="booking-success" class="success-panel hidden"><div class="success-icon">✓</div><h2>¡Solicitud enviada!</h2><p>El salón va a confirmar tu horario. Gracias por reservar.</p></div></section><footer class="booking-footer">Reservas simples con <strong>AgendaPorã</strong></footer></main></body></html>
